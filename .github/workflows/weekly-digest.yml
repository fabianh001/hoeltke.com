name: Weekly digest

on:
  schedule:
    # Friday 07:00 UTC — coffee time in Europe
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.publish.outputs.slug }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate this week's issue
        run: npm run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # optional: override the model without touching code (e.g. openai/gpt-5.1).
          # Unset → the script default (anthropic/claude-sonnet-4-6).
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}

      - name: Verify the site still builds
        run: npm run build

      # Human in the loop: with NEWSLETTER_REQUIRE_APPROVAL=true the issue goes
      # to a branch and opens a review PR, and nothing else happens — merging it
      # deploys the site and emails subscribers. Anything else (including unset)
      # publishes straight to main, as before.
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_APPROVAL: ${{ vars.NEWSLETTER_REQUIRE_APPROVAL }}
        run: |
          git config user.name "ai-weekly-bot"
          git config user.email "actions@github.com"
          git add src/content/digest
          slug="$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.md$//' | head -1)"
          git commit -m "digest: publish issue $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

          if [ "$REQUIRE_APPROVAL" = 'true' ]; then
            branch="digest/$slug"
            git push --force origin "HEAD:$branch"
            if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              gh pr create --head "$branch" --base main \
                --title "digest: issue $slug" \
                --body 'Auto-generated issue awaiting review. Edit the copy here if you want, then merge — merging deploys the site and emails subscribers.'
            fi
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            git push
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger the push workflows, so publishing
  # straight to main has to call deploy and the newsletter explicitly. In review
  # mode merging the PR is a human push, which triggers both on its own.
  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  send:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/newsletter.yml
    with:
      slug: ${{ needs.generate.outputs.slug }}
    secrets: inherit
