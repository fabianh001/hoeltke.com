name: Weekly digest

on:
  schedule:
    # Friday 07:00 UTC — coffee time in Europe
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.publish.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate this week's issue
        run: npm run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # optional: override the model without touching code (e.g. openai/gpt-5.1).
          # Unset → the script default (anthropic/claude-sonnet-4-6).
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}

      - name: Verify the site still builds
        run: npm run build

      - name: Commit and push
        id: publish
        run: |
          git config user.name "ai-weekly-bot"
          git config user.email "actions@github.com"
          git add src/content/digest
          slug="$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.md$//' | head -1)"
          git commit -m "digest: publish issue $slug"
          git push
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  # Email the freshly-published issue to subscribers as a Resend broadcast.
  # Idempotent: skips if a non-draft broadcast for this issue already exists.
  #
  # Human-in-the-loop flag: set the repo variable NEWSLETTER_REQUIRE_APPROVAL
  # to 'true' and this job runs in an environment with a required reviewer, so
  # it waits for a manual approval in the Actions tab. Anything else (including
  # unset) routes it through an unprotected environment and it sends straight
  # away. Deploy doesn't wait on this job — only the email does.
  send:
    needs: generate
    runs-on: ubuntu-latest
    environment: ${{ vars.NEWSLETTER_REQUIRE_APPROVAL == 'true' && 'newsletter-approval' || 'newsletter-auto' }}
    steps:
      # ref: main — a scheduled run's default SHA predates the digest commit above
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --slug pins the issue that was approved: an approval left sitting past
      # the next Friday would otherwise send the newer issue and skip this one.
      - name: Email the new issue to subscribers
        run: npm run send-newsletter -- --slug "${{ needs.generate.outputs.slug }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          # optional reply-to mailbox; kept in repo settings so no personal address lives in the repo
          RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}

  # pushes made with GITHUB_TOKEN don't trigger the push workflow,
  # so deploy explicitly after publishing
  deploy:
    needs: generate
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
