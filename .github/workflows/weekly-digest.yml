name: Weekly digest

on:
  schedule:
    # Friday 07:00 UTC — coffee time in Europe
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.publish.outputs.slug }}
      published: ${{ steps.publish.outputs.published }}
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Generate this week's issue
        run: npm run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # optional: override the model without touching code (e.g. openai/gpt-5.1).
          # Unset → the script default (anthropic/claude-sonnet-4-6).
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}

      - name: Verify the site still builds
        run: npm run build

      # Human in the loop: with NEWSLETTER_REQUIRE_APPROVAL=true the issue goes
      # to a branch and opens a review PR, and nothing else happens — merging it
      # generates audio, deploys the site, and emails subscribers. Anything else
      # (including unset) publishes straight to main, as before.
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_APPROVAL: ${{ vars.NEWSLETTER_REQUIRE_APPROVAL }}
        run: |
          git config user.name "ai-weekly-bot"
          git config user.email "actions@github.com"
          git add src/content/digest
          slug="$(git diff --cached --name-only | grep 'src/content/digest' | xargs -n1 basename | sed 's/\.md$//' | head -1)"
          git commit -m "digest: publish issue $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$REQUIRE_APPROVAL" = 'true' ]; then
            branch="digest/$slug"
            git push --force origin "HEAD:$branch"
            if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              gh pr create --head "$branch" --base main \
                --title "digest: issue $slug" \
                --body 'Auto-generated issue awaiting review. Edit the copy in this PR, then merge to approve the final text. Merging generates audio from the approved copy, publishes the site and audio, and sends only when audio is ready. If generation or publication fails, the sendout is held; retry the Newsletter workflow.'
            fi
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            git push
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

  # Bot pushes do not trigger push workflows. Call the same audio → deploy → send
  # pipeline explicitly, using the generated commit rather than the initial run SHA.
  send:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/newsletter.yml
    with:
      slug: ${{ needs.generate.outputs.slug }}
      revision: ${{ needs.generate.outputs.revision }}
    secrets: inherit
